<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学公式＆演習アプリ</title>

    <!-- MathJaxの読み込み -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
            margin: 16px;
            background: #f9f9f9;
            color: #333;
            line-height: 1.65;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }

        /* トップヘッダー（タイトル ＋ 右上の共有QRボタン） */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .top-header h1 {
            margin: 0;
            font-size: 22px;
        }
        .qr-btn {
            width: auto;
            margin: 0;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: bold;
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .qr-btn:hover {
            background: #e2e8f0;
        }

        /* 枠からはみ出さないよう word-break と overflow-x を設定 */
        .card {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
            margin-top: 12px;
            word-break: break-word;
            overflow-x: auto;
        }
        .card h4 {
            margin: 0 0 8px 0;
        }

        .empty-notice {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            padding: 18px;
            margin-top: 15px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        .check-box {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 6px;
            padding: 10px 12px;
            margin-top: 10px;
        }
        .check-box-title {
            font-size: 13px;
            font-weight: bold;
            color: #92400e;
            margin-bottom: 4px;
        }
        .check-box ul {
            margin: 4px 0 0 18px;
            padding: 0;
            font-size: 14px;
            color: #334155;
        }

        /* 演習モード「できた」チェックエリア */
        .done-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 14px;
        }
        .done-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #166534;
            margin: 0;
        }
        .done-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #16a34a;
            cursor: pointer;
            margin: 0;
        }
        .reset-done-btn {
            width: auto;
            margin: 0;
            padding: 4px 8px;
            font-size: 12px;
            background: #ffffff;
            color: #475569;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            cursor: pointer;
        }
        .reset-done-btn:hover {
            background: #f1f5f9;
        }

        /* QR描画エリア */
        .qr-box {
            background: #fff;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 200px;
            min-height: 200px;
            margin-bottom: 12px;
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            width: 90%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        .hidden {
            display: none !important;
        }
        .filter-group {
            background: #e0f2fe;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- トップヘッダー：左にタイトル、右上に共有QRボタン -->
    <div class="top-header">
        <h1>数学公式アプリ</h1>
        <button type="button" class="qr-btn" onclick="openQrModal()" title="共有用QRコードを表示">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1"/>
                <rect x="14" y="3" width="7" height="7" rx="1"/>
                <rect x="3" y="14" width="7" height="7" rx="1"/>
                <path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 20h2M20 14v2"/>
            </svg>
            共有QR
        </button>
    </div>

    <!-- トップ画面：問題演習ボタン -->
    <button type="button" onclick="startExercise()" style="background-color: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer;">問題演習モードへ</button>
    <hr style="margin: 20px 0;">

    <!-- ① プルダウン選択エリア -->
    <h3>公式・学習モード</h3>
    <label for="levelSelect">レベル：</label>
    <select id="levelSelect" onchange="updateUnits()">
        <option value="全て">全て</option>
        <option value="基礎">基礎</option>
        <option value="公立">公立</option>
        <option value="難関私立">難関私立</option>
    </select>

    <label for="categorySelect">カテゴリ：</label>
    <select id="categorySelect" onchange="updateUnits()">
        <option value="全て">全て</option>
        <option value="数式">数式</option>
        <option value="関数">関数</option>
        <option value="平面図形">平面図形</option>
        <option value="立体図形">立体図形</option>
        <option value="その他">その他</option>
    </select>

    <label for="unitSelect">単元：</label>
    <select id="unitSelect" onchange="loadFormulaContent()">
        <!-- JSで動的に書き換え -->
    </select>

    <!-- 単元未選択時の案内（初期表示） -->
    <div id="emptyStateArea" class="empty-notice">
        単元を選択すると、公式・問題・答え・解説が表示されます。
    </div>

    <!-- ② 公式・問題表示エリア -->
    <div id="learningArea" class="hidden">
        <div class="card">
            <h4 id="formulaTitle">【公式】</h4>
            <div id="displayFormula">-</div>
        </div>

        <!-- 1. 問題 -->
        <div class="card">
            <h4>【問題】</h4>
            <div id="displayProblem">-</div>
        </div>

        <!-- 2. 答えボタンとボックス -->
        <button type="button" onclick="toggleAnswer()" style="background-color: #f59e0b; color: white; border: none; border-radius: 5px; cursor: pointer;">答えを見る</button>
        <div id="answerBox" class="card hidden">
            <h4>【答え】</h4>
            <div id="displayAnswer">-</div>
        </div>

        <!-- 3. 解説ボタンとボックス -->
        <button type="button" onclick="toggleExplanation()" style="background-color: #10b981; color: white; border: none; border-radius: 5px; cursor: pointer;">解説を見る</button>
        <div id="explanationBox" class="card hidden">
            <h4>【解説】</h4>
            <div id="displayExplanation">-</div>
        </div>

        <!-- 4. 問題の更新ボタン -->
        <button type="button" onclick="refreshProblem()" style="background-color: #0284c7; color: white; border: none; border-radius: 5px; cursor: pointer;">問題の更新（別パターン生成）</button>
    </div>
</div>

<!-- 共有用QRコードモーダル -->
<div class="overlay" id="qrOverlay" onclick="closeQrModal()"></div>
<div class="popup" id="qrPopup" style="max-width: 320px; text-align: center;">
    <h3 style="margin-top: 0;">共有用QRコード</h3>
    <p id="qrUnitLabel" style="font-size: 13px; font-weight: bold; color: #334155; margin-bottom: 10px;"></p>
    <div class="qr-box">
        <img id="qrImage" src="" alt="共有用QRコード" width="200" height="200" style="display: block;">
    </div>
    <button type="button" id="copyUrlBtn" onclick="copyShareUrl()" style="background-color: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer;">リンクをコピー</button>
    <button type="button" onclick="closeQrModal()" style="margin-top: 6px; cursor: pointer; background: #e2e8f0; border: none; border-radius: 4px; padding: 10px;">閉じる</button>
</div>

<!-- ③ 問題演習モード用ポップアップ -->
<div class="overlay" id="overlay" onclick="closeExercise()"></div>
<div class="popup" id="exercisePopup">
    <h2 style="margin-top: 0;">ランダム問題演習</h2>

    <!-- レベル・カテゴリ選択フィルター -->
    <div class="filter-group">
        <label style="font-size: 14px; font-weight: bold;">【出題条件の絞り込み】</label>
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label for="exLevelSelect" style="font-size: 12px;">レベル：</label>
                <select id="exLevelSelect" style="font-size: 14px; padding: 6px;">
                    <option value="全て">全て</option>
                    <option value="基礎">基礎</option>
                    <option value="公立">公立</option>
                    <option value="難関私立">難関私立</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label for="exCategorySelect" style="font-size: 12px;">カテゴリ：</label>
                <select id="exCategorySelect" style="font-size: 14px; padding: 6px;">
                    <option value="全て">全て</option>
                    <option value="数式">数式</option>
                    <option value="関数">関数</option>
                    <option value="平面図形">平面図形</option>
                    <option value="立体図形">立体図形</option>
                    <option value="その他">その他</option>
                </select>
            </div>
        </div>
        <button type="button" onclick="nextExercise()" style="background-color: #0ea5e9; color: white; border: none; border-radius: 4px; margin-top: 8px; cursor: pointer; padding: 6px;">この条件で問題を出題</button>
    </div>

    <p><strong>単元:</strong> <span id="exUnitName">-</span> (レベル: <span id="exLevelName">-</span>)</p>

    <!-- 1. 問題 -->
    <div class="card">
        <div id="exProblem">-</div>
    </div>

    <!-- 「できた」チェックバー -->
    <div class="done-bar">
        <label class="done-label">
            <input type="checkbox" id="exDoneCheckbox" onchange="toggleCurrentDone()">
            <span>この問題は「できた」</span>
        </label>
        <button type="button" class="reset-done-btn" onclick="resetCompletedUnits()" title="できた記録をすべて解除">記録リセット</button>
    </div>

    <!-- 公式確認ボタンと切り替え用領域 -->
    <button type="button" onclick="togglePopupFormula()" style="background-color: #64748b; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px;">公式を確認</button>
    <div id="exFormulaResult" class="hidden card" style="font-weight: bold; color: #475569; margin-top: 5px;"></div>

    <!-- 2. 答えボタンと切り替え用領域 -->
    <button type="button" onclick="togglePopupAnswer()" style="background-color: #f59e0b; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px;">答えを見る</button>
    <div id="exAnswerResult" class="hidden card" style="margin-top: 5px;"></div>

    <!-- 3. 解説ボタンと切り替え用領域 -->
    <button type="button" onclick="togglePopupExplanation()" style="background-color: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 5px;">解説を見る</button>
    <div id="exExplanationResult" class="hidden card" style="margin-top: 5px;"></div>

    <!-- 解説ボタンの直下：同じ公式で問題を更新 -->
    <button type="button" onclick="refreshSameUnitExercise()" style="background-color: #0284c7; color: white; border: none; border-radius: 4px; margin-top: 10px; cursor: pointer;">同じ公式で問題を更新</button>

    <!-- 次の問題へボタン -->
    <button type="button" onclick="nextExercise()" style="background-color: #2563eb; color: white; border: none; border-radius: 4px; margin-top: 5px; cursor: pointer;">次の問題へ</button>
    <button type="button" onclick="closeExercise()" style="margin-top: 5px; cursor: pointer; background: #e2e8f0; border: none; border-radius: 4px; padding: 10px;">閉じる</button>
</div>

<!-- 外部データの読み込み -->
<script src="formulas.js"></script>
<script>
    let currentData = null;
    let activeCategoryMap = {};
    let unitIndexMap = {};
    let currentExData = {};
    const completedUnitKeys = new Set();

    const INITIAL_TOP_URL = (() => {
        const u = new URL(window.location.href);
        u.search = "";
        u.hash = "";
        return u.toString();
    })();

    function getUnitKey(category, unit) {
        return `${category}___${unit}`;
    }

    function syncDoneCheckbox() {
        const cb = document.getElementById('exDoneCheckbox');
        if (!cb) return;
        if (currentExData && currentExData.category && currentExData.unit) {
            cb.checked = completedUnitKeys.has(getUnitKey(currentExData.category, currentExData.unit));
        } else {
            cb.checked = false;
        }
    }

    function toggleCurrentDone() {
        const cb = document.getElementById('exDoneCheckbox');
        if (!cb || !currentExData || !currentExData.category || !currentExData.unit) return;
        const key = getUnitKey(currentExData.category, currentExData.unit);
        if (cb.checked) {
            completedUnitKeys.add(key);
        } else {
            completedUnitKeys.delete(key);
        }
    }

    function resetCompletedUnits() {
        completedUnitKeys.clear();
        syncDoneCheckbox();
        alert("「できた」記録をリセットしました。");
    }

    function hasSelectedUnit() {
        return Boolean(currentData && currentData.actualCategory && currentData.actualUnit);
    }

    function getShareUrl() {
        if (!hasSelectedUnit()) {
            return INITIAL_TOP_URL;
        }
        const url = new URL(INITIAL_TOP_URL);
        url.searchParams.set("cat", currentData.actualCategory);
        url.searchParams.set("unit", currentData.actualUnit);
        return url.toString();
    }

    function openQrModal() {
        const isUnitPage = hasSelectedUnit();
        const shareUrl = getShareUrl();
        const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(shareUrl);

        document.getElementById('qrImage').src = qrApiUrl;
        document.getElementById('qrUnitLabel').textContent = isUnitPage
            ? `【${currentData.actualCategory}】${currentData.actualUnit}`
            : "最初の画面（アプリトップ・固定）";
        document.getElementById('copyUrlBtn').textContent = "リンクをコピー";
        document.getElementById('qrOverlay').style.display = 'block';
        document.getElementById('qrPopup').style.display = 'block';
    }

    function closeQrModal() {
        document.getElementById('qrOverlay').style.display = 'none';
        document.getElementById('qrPopup').style.display = 'none';
    }

    function copyShareUrl() {
        const shareUrl = getShareUrl();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(shareUrl).then(() => {
                document.getElementById('copyUrlBtn').textContent = "コピーしました！";
            });
        } else {
            const tempInput = document.createElement('input');
            tempInput.value = shareUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            document.getElementById('copyUrlBtn').textContent = "コピーしました！";
        }
    }

    function applyQueryParams() {
        if (typeof formulaData === "undefined") return;
        const params = new URLSearchParams(window.location.search);
        const paramCat = params.get("cat");
        const paramUnit = params.get("unit");

        if (!paramCat || !paramUnit) return;
        if (!formulaData[paramCat] || !formulaData[paramCat][paramUnit]) return;

        document.getElementById('levelSelect').value = "全て";
        document.getElementById('categorySelect').value = paramCat;
        updateUnits(true);

        const unitSelect = document.getElementById('unitSelect');
        const targetOption = Array.from(unitSelect.options).find(opt => {
            const rawUnit = opt.value.includes("___") ? opt.value.split("___")[1] : opt.value;
            return rawUnit === paramUnit;
        });
        if (targetOption) {
            unitSelect.value = targetOption.value;
            loadFormulaContent();
        }
    }

    function renderMath(elementId) {
        if (!window.MathJax) return;
        const targets = elementId ? [document.getElementById(elementId)].filter(Boolean) : undefined;
        if (typeof MathJax.typesetPromise === "function") {
            if (targets && typeof MathJax.typesetClear === "function") {
                MathJax.typesetClear(targets);
            }
            MathJax.typesetPromise(targets).catch(() => {});
        } else if (typeof MathJax.typeset === "function") {
            MathJax.typeset(targets);
        }
    }

    function extractAnswer(explanation) {
        if (!explanation) return "（答えなし）";
        let clean = explanation.replace(/【解説】<br>/g, "");
        let parts = clean.split("<br>");
        return parts[parts.length - 1] || clean;
    }

    function buildSelfCheckHtml(unitData, generated) {
        const rawCheck = (generated && generated.selfCheck) || (unitData && unitData.selfCheck);

        if (typeof rawCheck === "string" && rawCheck.trim() !== "") {
            return `
                <div class="check-box">
                    <div class="check-box-title">間違えたときの自己チェック</div>
                    <div>${rawCheck}</div>
                </div>
            `;
        }

        const items = (Array.isArray(rawCheck) && rawCheck.length > 0)
            ? rawCheck
            : [
                "どの定理・どの図形（三角形や辺）を使うか正しく選べたか？",
                "比の逆数や線分の合計（足し算）を取り違えていないか？",
                "求める線分比の「順番」を逆にしていないか？"
            ];

        return `
            <div class="check-box">
                <div class="check-box-title">間違えたときの自己チェック</div>
                <ul style="line-height:1.5;">${items.map(t => `<li style="margin-bottom:6px;">${t}</li>`).join("")}</ul>
            </div>
        `;
    }

    function buildAnswerAndCheckHtml(unitData, generated, fallbackExplanation) {
        const rawAnswer = (generated && generated.answer)
            ? generated.answer
            : extractAnswer(fallbackExplanation);

        return `
            <div style="font-size: 18px; font-weight: bold; color: #0f172a;">${rawAnswer}</div>
            ${buildSelfCheckHtml(unitData, generated)}
        `;
    }

    function showEmptyState(messageText) {
        currentData = null;
        const emptyEl = document.getElementById('emptyStateArea');
        const learnEl = document.getElementById('learningArea');
        if (emptyEl) {
            emptyEl.textContent = messageText || "単元を選択すると、公式・問題・答え・解説が表示されます。";
            emptyEl.classList.remove('hidden');
        }
        if (learnEl) {
            learnEl.classList.add('hidden');
        }
    }

    function showLearningState() {
        const emptyEl = document.getElementById('emptyStateArea');
        const learnEl = document.getElementById('learningArea');
        if (emptyEl) emptyEl.classList.add('hidden');
        if (learnEl) learnEl.classList.remove('hidden');
    }

    function updateUnits(skipLoad = false) {
        if (typeof formulaData === "undefined") {
            showEmptyState("公式データ（formulas.js）を読み込めませんでした。");
            return;
        }
        const selectedLevel = document.getElementById('levelSelect').value;
        const cat = document.getElementById('categorySelect').value;
        const unitSelect = document.getElementById('unitSelect');
        unitSelect.innerHTML = '';
        activeCategoryMap = {};
        unitIndexMap = {};

        const placeholderOpt = document.createElement('option');
        placeholderOpt.value = "";
        placeholderOpt.textContent = "-- 単元を選択してください --";
        unitSelect.appendChild(placeholderOpt);

        let targetCategories = [];
        if (cat === "全て") {
            targetCategories = Object.keys(formulaData);
        } else if (formulaData[cat]) {
            targetCategories = [cat];
        }

        let count = 1;
        targetCategories.forEach(category => {
            Object.keys(formulaData[category]).forEach(unit => {
                const levelStr = formulaData[category][unit].level || "";
                const matchesLevel = (selectedLevel === "全て") || levelStr.includes(selectedLevel);

                if (matchesLevel) {
                    let optVal = cat === "全て" ? `${category}___${unit}` : unit;
                    let optText = cat === "全て" ? `${count}. [${category}] ${unit}` : `${count}. ${unit}`;

                    let opt = document.createElement('option');
                    opt.value = optVal;
                    opt.textContent = optText;
                    unitSelect.appendChild(opt);

                    activeCategoryMap[optVal] = category;
                    unitIndexMap[optVal] = count;
                    count++;
                }
            });
        });

        if (!skipLoad) {
            loadFormulaContent();
        }
    }

    function loadFormulaContent() {
        const selectedLevel = document.getElementById('levelSelect').value;
        const catSelect = document.getElementById('categorySelect').value;
        const unitVal = document.getElementById('unitSelect').value;

        if (!unitVal) {
            showEmptyState("単元を選択すると、公式・問題・答え・解説が表示されます。");
            return;
        }

        let cat = catSelect;
        let unit = unitVal;

        if (catSelect === "全て") {
            cat = activeCategoryMap[unitVal];
            unit = unitVal.split("___")[1];
        }

        const currentNumber = unitIndexMap[unitVal] || 1;

        if (selectedLevel === "全て" && catSelect === "全て" && formulaData[cat] && formulaData[cat][unit]) {
            const itemLevel = formulaData[cat][unit].level || "";
            document.getElementById('formulaTitle').textContent = `【公式】 No.${currentNumber} ${itemLevel}`;
        } else {
            document.getElementById('formulaTitle').textContent = `【公式】 No.${currentNumber}`;
        }

        if (formulaData[cat] && formulaData[cat][unit]) {
            showLearningState();
            currentData = formulaData[cat][unit];
            currentData.actualCategory = cat;
            currentData.actualUnit = unit;

            document.getElementById('displayFormula').innerHTML = currentData.formula;

            let generated = null;
            let prob = "";
            let expl = "";
            if (typeof currentData.generateRandom === "function") {
                generated = currentData.generateRandom();
                prob = generated.problem;
                expl = generated.explanation;
            } else {
                prob = currentData.problem;
                expl = currentData.explanation;
            }

            document.getElementById('displayProblem').innerHTML = prob;
            document.getElementById('displayAnswer').innerHTML = buildAnswerAndCheckHtml(currentData, generated, expl);
            document.getElementById('displayExplanation').innerHTML = expl;

            currentData.activeProblem = prob;
            currentData.activeAnswer = (generated && generated.answer) ? generated.answer : extractAnswer(expl);
            currentData.activeExplanation = expl;

            renderMath('learningArea');
        } else {
            showEmptyState("（データ準備中）");
        }
        document.getElementById('answerBox').classList.add('hidden');
        document.getElementById('explanationBox').classList.add('hidden');
    }

    function refreshProblem() {
        if (currentData && typeof currentData.generateRandom === "function") {
            let generated = currentData.generateRandom();
            currentData.activeProblem = generated.problem;
            currentData.activeAnswer = generated.answer || extractAnswer(generated.explanation);
            currentData.activeExplanation = generated.explanation;

            document.getElementById('displayProblem').innerHTML = generated.problem;
            document.getElementById('displayAnswer').innerHTML = buildAnswerAndCheckHtml(
                currentData,
                generated,
                generated.explanation
            );
            document.getElementById('displayExplanation').innerHTML = generated.explanation;

            document.getElementById('answerBox').classList.add('hidden');
            document.getElementById('explanationBox').classList.add('hidden');

            renderMath('learningArea');
        } else {
            alert("この単元のランダム生成はまだ準備されていません。");
        }
    }

    function toggleAnswer() {
        const box = document.getElementById('answerBox');
        box.classList.toggle('hidden');
        if (!box.classList.contains('hidden')) {
            renderMath('answerBox');
        }
    }

    function toggleExplanation() {
        const box = document.getElementById('explanationBox');
        box.classList.toggle('hidden');
        if (!box.classList.contains('hidden')) {
            renderMath('explanationBox');
        }
    }

    function renderExerciseProblem(targetCategory, randomSubKey, targetItem) {
        let gen = null;
        let prob = "";
        let expl = "";

        if (typeof targetItem.generateRandom === "function") {
            gen = targetItem.generateRandom();
            prob = gen.problem;
            expl = gen.explanation;
        } else {
            prob = targetItem.problem;
            expl = targetItem.explanation;
        }

        currentExData = {
            category: targetCategory,
            unit: randomSubKey,
            level: targetItem.level || "",
            formula: targetItem.formula || "",
            problem: prob,
            answer: (gen && gen.answer) ? gen.answer : extractAnswer(expl),
            explanation: expl,
            unitData: targetItem,
            generated: gen
        };

        document.getElementById('exUnitName').textContent = `${targetCategory} / ${randomSubKey}`;
        document.getElementById('exLevelName').textContent = currentExData.level;
        document.getElementById('exProblem').innerHTML = currentExData.problem;

        syncDoneCheckbox();

        const formulaRes = document.getElementById('exFormulaResult');
        formulaRes.innerHTML = "【公式】<br>" + currentExData.formula;
        formulaRes.classList.add('hidden');

        const ansRes = document.getElementById('exAnswerResult');
        ansRes.innerHTML = "<h4>【答え】</h4>" + buildAnswerAndCheckHtml(
            currentExData.unitData,
            { ...(currentExData.generated || {}), answer: currentExData.answer },
            currentExData.explanation
        );
        ansRes.classList.add('hidden');

        const explRes = document.getElementById('exExplanationResult');
        explRes.innerHTML = "【解説】<br>" + currentExData.explanation;
        explRes.classList.add('hidden');

        renderMath('exercisePopup');
    }

    function refreshSameUnitExercise() {
        if (!currentExData || !currentExData.category || !currentExData.unit) {
            nextExercise();
            return;
        }
        const cat = currentExData.category;
        const unit = currentExData.unit;
        const targetItem = (formulaData[cat] && formulaData[cat][unit])
            ? formulaData[cat][unit]
            : currentExData.unitData;

        if (!targetItem) {
            nextExercise();
            return;
        }
        renderExerciseProblem(cat, unit, targetItem);
    }

    function startExercise() {
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('exercisePopup').style.display = 'block';
        nextExercise();
    }

    function closeExercise() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('exercisePopup').style.display = 'none';
    }

    function nextExercise() {
        if (typeof formulaData === "undefined") return;
        const selectedLevel = document.getElementById('exLevelSelect').value;
        let selectedCategory = document.getElementById('exCategorySelect').value;

        let targetCategories = [];
        if (!selectedCategory || selectedCategory === "全て") {
            targetCategories = Object.keys(formulaData);
        } else {
            targetCategories = [selectedCategory];
        }

        let matchedUnits = [];
        targetCategories.forEach(cat => {
            if (formulaData[cat]) {
                Object.keys(formulaData[cat]).forEach(unit => {
                    const levelStr = formulaData[cat][unit].level || "";
                    const matchesLevel = (selectedLevel === "全て") || levelStr.includes(selectedLevel);

                    if (matchesLevel) {
                        matchedUnits.push({ category: cat, unit: unit });
                    }
                });
            }
        });

        if (matchedUnits.length === 0) {
            alert("条件に一致する問題がありません。条件を変更してください。");
            return;
        }

        const remainingUnits = matchedUnits.filter(
            pair => !completedUnitKeys.has(getUnitKey(pair.category, pair.unit))
        );

        if (remainingUnits.length === 0) {
            const shouldReset = confirm("この条件の問題はすべて「できた」になっています。「できた」記録をリセットして最初から出題しますか？");
            if (shouldReset) {
                completedUnitKeys.clear();
                nextExercise();
            }
            return;
        }

        const selectedPair = remainingUnits[Math.floor(Math.random() * remainingUnits.length)];
        const targetCategory = selectedPair.category;
        const randomSubKey = selectedPair.unit;
        const targetItem = formulaData[targetCategory][randomSubKey];

        renderExerciseProblem(targetCategory, randomSubKey, targetItem);
    }

    function togglePopupFormula() {
        const formulaRes = document.getElementById('exFormulaResult');
        formulaRes.classList.toggle('hidden');
        if (!formulaRes.classList.contains('hidden')) {
            renderMath('exFormulaResult');
        }
    }

    function togglePopupAnswer() {
        const ansRes = document.getElementById('exAnswerResult');
        ansRes.classList.toggle('hidden');
        if (!ansRes.classList.contains('hidden')) {
            renderMath('exAnswerResult');
        }
    }

    function togglePopupExplanation() {
        const explRes = document.getElementById('exExplanationResult');
        explRes.classList.toggle('hidden');
        if (!explRes.classList.contains('hidden')) {
            renderMath('exExplanationResult');
        }
    }

    window.onload = function () {
        updateUnits();
        applyQueryParams();
    };
</script>

</body>
